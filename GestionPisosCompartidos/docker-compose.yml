services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: roommate-sqlserver
    environment:
      SA_PASSWORD: "RoomMate2026!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "RoomMate2026!", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: GestionPisosCompartidos.API/Dockerfile
    container_name: roommate-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: GestionPisosCompartidos.Client/Dockerfile
    container_name: roommate-client
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  sqlserver_data: